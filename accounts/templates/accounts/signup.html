{% extends 'base.html' %}

{% block content %} 
  <h2>Create an Account</h2>
  <form method="post"> 
    {% csrf_token %} <!-- This is a Django template tag that generates a hidden input field with a CSRF token, which is used to protect against Cross-Site Request Forgery attacks. -->
    {{ form.as_p }} <!-- This is a Django template tag that renders the form fields as paragraphs. -->
    <button type="submit">Sign Up</button>
  </form>
{% endblock %}
