{% extends "base.html" %} <!-- we were able to use base.html from invoices template because all templates are in the same directory -->
{% block content %}

<h1>Login</h1>
<form method="post">
  {% csrf_token %}
  <!-- Cross Site Request Forgery token: It's a template tag which will create a hidden security token. Without this token django will reject submission. -->
  {{ form.as_p }}
  <!-- form is a variable form views.py and Django will rapup all fields as paragraphs. -->
  <button type="submit">Login</button>
</form>

{% endblock %}
